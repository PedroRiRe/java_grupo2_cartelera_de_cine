<!Doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detalle de usuario</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
    <div class="row mt-5">
        <h1 class="cinefilos-h1">Detalle de usuario</h1>
        <div class="col">
        </div>
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${user.username}"></h5>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:text="|Nombre: ${user.name}|"></li>
                    <li class="list-group-item" th:text="|Apellidos: ${user.surname}|"></li>
                    <li class="list-group-item" th:text="|Correo: ${user.email}|"></li>
                </ul>
                <div class="card-body">
                    <a class="btn btn-outline-primary" th:href="@{/users}" role="button">Volver</a>
                    <a class="btn btn-outline-success" th:href="@{/users/{id}/edit(id=${user.id})}" sec:authorize="isAuthenticated()" role="button">Editar</a>
                    <a th:if="${user.id != #authentication.getPrincipal().getId()}" class="btn btn-outline-danger" th:href="@{/users/{id}/delete(id=${user.id})}" sec:authorize="isAuthenticated()" role="button">Borrar</a>
                    <a th:unless="${user.id != #authentication.getPrincipal().getId()}" class="btn btn-outline-danger disabled" th:href="@{/users/{id}/delete(id=${user.id})}" sec:authorize="isAuthenticated()" role="button">Borrar</a>
                </div>
            </div>
        </div>
        <div class="col">
        </div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
