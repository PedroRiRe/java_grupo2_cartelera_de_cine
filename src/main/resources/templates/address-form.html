<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Address Form</title>

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
  <div class="row">

    <h1>Crear/Editar Address</h1>

    <div class="col"></div>
    <h1 th:if="${address.id}" class="h1-title">Modificar Address <span th:text="${address.id}"></span></h1>
    <h1 th:if="${address.id} == null" class="h1-title">Crear nuevo Address</h1>

        <div class="col">


      <div th:if="${error}">
        <div class="alert alert-danger" role="alert" >
          <p th:text="${error}"></p>
        </div>
        <a type="button" class="btn btn-primary" th:href="@{/addresses}">Volver</a>
      </div>

      <form th:if="${error} == null" th:action="@{/addresses}" method="POST" th:object="${address}">

        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control" id="address" th:field="*{address}" >
        </div>

        <div class="mb-3">
          <label for="postalCode" class="form-label">PostalCode</label>
          <input type="text" class="form-control" id="postalCode" th:field="*{postalCode}">
        </div>

        <div class="mb-3">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" id="city" th:field="*{city}">
        </div>

        <div class="mb-3">
          <label for="country" class="form-label">Country</label>
          <input type="text" class="form-control" id="country" th:field="*{country}">
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
      </form>

    </div>

    <div class="col"></div>
  </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
