<!Doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Film List</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-left">
  <div class="row">
    <h1>Listado de films</h1>

    <div class="col mt-3">
      <button type="button" class="btn btn-success">Crear nuevo film</button>

      <table class="table">
        <thead>
        <tr>
          <th scope="col">Id</th>
          <th scope="col">Title</th>
          <th scope="col">Duration</th>
          <th scope="col">Year</th>
          <th scope="col">Director</th>
          <th scope="col">Country</th>
          <th scope="col">Classification</th>
          <th scope="col">Rating</th>
          <th scope="col">Music</th>
          <th scope="col">Photography</th>
          <th scope="col">Script</th>
          <th scope="col">Company</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="film: ${films}">
          <td th:text="${film.id}"></td>
          <td th:text="${film.title}"></td>
          <td th:text="${film.duration}"></td>
          <td th:text="${film.year}"></td>
          <td th:text="${film.director}"></td>
          <td th:text="${film.country}"></td>
          <td th:text="${film.classification}"></td>
          <td th:text="${film.rating}"></td>
          <td th:text="${film.music}"></td>
          <td th:text="${film.photography}"></td>
          <td th:text="${film.script}"></td>
          <td th:text="${film.company}"></td>
          <td>
            <a class="btn btn-primary btn-sm" th:href="@{/film/{id}(id=${film.id})}">Ver</a>
            <button type="button" class="btn btn-success btn-sm">Editar</button>
            <button type="button" class="btn btn-danger btn-sm">Borrar</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
