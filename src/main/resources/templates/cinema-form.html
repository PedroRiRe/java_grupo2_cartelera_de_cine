<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cinema Form</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
    <div class="row">

        <h1 th:if="${cinema.id}">Modificar datos de un cine <span th:text="${cinema.id}"></span></h1>
        <h1 th:if="${cinema.id} == null">Crear nuevo Food</h1>

        <div class="col"></div>

        <div class="col">

            <div th:if="${error}">
                <div class="alert alert-danger" role="alert" >
                    <p th:text="${error}"></p>
                </div>
                <a type="button" class="btn btn-primary" th:href="@{/cinemas}">Volver</a>
            </div>

            <form th:if="${error} == null" th:action="@{/cinemas}" method="POST" th:object="${cinema}">

                <input type="hidden" id="id" name="id" th:field="*{id}"/>

                <div class="mb-3">
                    <label for="cif" class="form-label">CIF</label>
                    <input type="text" class="form-control" id="cif" th:field="*{cif}" >
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" >
                </div>

                <div class="mb-3">
                    <label for="url" class="form-label">url</label>
                    <input type="text" class="form-control" id="url" th:field="*{url}">
                </div>

                <div class="mb-3">
                    <label for="twitter" class="form-label">Twitter</label>
                    <input type="text" class="form-control" id="twitter" th:field="*{twitter}">
                </div>

                <div class="mb-3">
                    <label for="linkedIn" class="form-label">LinkedIn</label>
                    <input type="text" class="form-control" id="linkedIn" th:field="*{linkedIn}">
                </div>

                <div class="mb-3">
                    <label for="facebook" class="form-label">Facebook</label>
                    <input type="text" class="form-control" id="facebook" th:field="*{facebook}">
                </div>

                <div class="mb-3">
                    <label for="instagram" class="form-label">Instagram</label>
                    <input type="text" class="form-control" id="instagram" th:field="*{instagram}">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">email</label>
                    <input type="text" class="form-control" id="email" th:field="*{email}">
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">phone</label>
                    <input type="text" class="form-control" id="phone" th:field="*{phone}">
                </div>

                <a class="btn btn-danger" th:href="@{/cinemas}">CANCELAR</a>
                <button type="submit" class="btn btn-success">GUARDAR</button>
            </form>

        </div>

        <div class="col"></div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
