<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Direcciones</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
    <link rel="stylesheet" th:href="@{/css/list.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-left">
    <div class="row mt-5">
        <h1 class="cinefilos-h1">Listado de direcciones</h1>

        <div class="col mt-3 alert alert-info" role="alert" th:if="${#lists.isEmpty(addresses)}">
            Actualmente no hay ninguna dirección para mostrar.
        </div>
        <main class="container-address">

            <div class="row row-cols-1 row-cols-md-4 g-2">
                <div class="card-deck" th:each="address: ${addresses}">
                            <div class="card">
                                <img th:if="${address != null}" th:src="@{${address.image}}" class="img-fluid rounded-start"/>
                                <img th:unless="${address != null}" th:src="./img/close-menu.png" class="img-fluid rounded-start"
                                     th:alt="| No disponible |"/>
                                <div class="card-body">
                                    <h5 th:if="${address != null}" class="card-title" th:text="|Dirección ${address.street}|"></h5>
                                    <h5 th:unless="${address != null}" class="card-title" th:text="|Dirección no disponible|"></h5>
                                    <p th:if="${address != null}" class="card-text" th:text="${address.postalCode}"></p>
                                    <p th:unless="${address != null}" class="card-text" th:text="| Dirección no disponible |"></p>
                                    <h5 th:if="${address != null}" class="card-title" th:text="${address.city}"></h5>
                                    <h5 th:unless="${address != null}" class="card-title" th:text="| Dirección no disponible |"></h5>
                                    <p th:if="${address != null}" class="card-text" th:text="${address.country}"></p>
                                    <p th:unless="${address != null}" class="card-text" th:text="| Dirección no disponible |"></p>
                                </div>
                            </div>
                    <div class="card-opt mx-auto">

                        <a th:href="@{/address/{id}(id=${address.id})}">
                            <img width="35" height="35" src="/img/icons/Ver.svg"
                                 th:title="|Ver detalle de Dirección ${address.street}|"
                                 th:alt="|Ver detalle de Dirección ${address.street}|">
                        </a>

                        <a th:href="@{/addresses/{id}/edit(id=${address.id})}"
                           sec:authorize="isAuthenticated()">
                            <img width="35" height="35" src="/img/icons/Editar.svg"
                                 th:title="|Editar Dirección ${address.street}"
                                 th:alt="|Editar Dirección ${address.street}|">
                        </a>

                        <a th:href="@{/addresses/{id}/delete(id=${address.id})}"
                           sec:authorize="isAuthenticated()">
                            <img width="35" height="35" src="/img/icons/Borrar.svg"
                                 th:title="|Eliminar Dirección ${address.street}"
                                 th:alt="|Eliminar Dirección ${address.street}|">
                        </a>
                    </div>
                </div>
            </div>
        </main>




















            <div class="text-center">
                Actualmente hay <span th:text="${#lists.size(addresses)}"></span> direcciones.
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a class="btn btn-outline-primary" th:href="@{/addresses/create}"
           sec:authorize="isAuthenticated()" role="button">Crear nueva Dirección</a>
        <a class="btn btn-outline-success" th:href="@{/}" role="button">Portada</a>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
