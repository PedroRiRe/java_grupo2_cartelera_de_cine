<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title class = "h1-title">Detalle de dirección</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&family=Satisfy&display=swap" rel="stylesheet">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
    <div class="row mt-5">
        <h1 class="cinefilos-h1">Detalle de dirección</h1>
        <div class="col">
        </div>

        <div th:if="${error}">
            <div class="alert alert-danger" role="alert" >
                <p th:text="${error}"></p>
            </div>
            <a class="btn btn-primary" th:href="@{/addresses}">Volver</a>
        </div>

        <div class="col">
            <div class="card">
                <img src="https://dummyimage.com/300" class="card-img-top" alt="Address Image">
                <div class="card-body">
                    <h5 class="card-title" th:text="${address.address}|"></h5>
                    <p class="card-text" th:text="|CP:${address.postalCode}"></p>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:text="|Ciudad: ${address.city}|"></li>
                    <li class="list-group-item" th:text="|País: ${address.country}|"></li>
                </ul>

                <div class="card-body">
                    <a class="btn btn-outline-primary" th:href="@{/addresses}">Volver</a>
                    <a class="btn btn-outline-success" th:href="@{/addresses/{id}/edit(id=${address.id})}">Editar</a>
                    <a class="btn btn-outline-danger" th:href="@{/addresses/{id}/delete(id=${address.id})}">Borrar</a>
                </div>


            </div>
        </div>
        <div class="col">
        </div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
