<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pruebas</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
    <div class="row mt-5">
        <h1>Opciones de prueba</h1>
        <div class="col mt-5">
            <div class="btn-group btn-group-lg">
                <a class="btn btn-primary" th:href="@{/cinemas}">Cines</a>
                <a class="btn btn-primary" th:href="@{/rooms}">Salas</a>
                <a class="btn btn-primary" th:href="@{/films}">Películas</a>
                <a class="btn btn-primary" th:href="@{/users}">Usuarios</a>
                <a class="btn btn-primary" th:href="@{/addresses}">Direcciones</a>
            </div>
        </div>
    </div>
</div>

<!----------------------  carrusel --------------------------------------------->

<div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="false">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="/img/films/batman.jfif" class="d-block w-100" alt="Batman">
            <div class="carousel-caption d-none d-md-block">
                <h5>Batman</h5>
                <p>Universal</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/piloto.jpg" class="d-block w-100" alt="El piloto">
            <div class="carousel-caption d-none d-md-block">
                <h5>El Piloto</h5>
                <p>De Jean-Francois Richet</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/monstruo.jpg" class="d-block w-100" alt="Mi querido monstruo">
            <div class="carousel-caption d-none d-md-block">
                <h5>Mi Querido Monstruo</h5>
                <p>Paramount Pictures</p>
            </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
