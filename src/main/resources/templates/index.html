<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<!----------------------  carrusel --------------------------------------------->

<div class="col"></div>

    <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="false">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3"
                    aria-label="Slide 4"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="4"
                    aria-label="Slide 5"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="5"
                    aria-label="Slide 6"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="6"
                    aria-label="Slide 7"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="7"
                    aria-label="Slide 8"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="8"
                    aria-label="Slide 9"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="9"
                    aria-label="Slide 10"></button>
        </div>
        <div class="carousel-item active">
            <img src="/img/films/batman.jfif" class="d-block w-100" alt="Batman">
            <div class="carousel-caption d-none d-md-block">
                <h5>Batman</h5>
                <p>Universal</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/piloto.jpg" class="d-block w-100" alt="El piloto">
            <div class="carousel-caption d-none d-md-block">
                <h5>El Piloto</h5>
                <p>De Jean-Francois Richet</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/monstruo.jpg" class="d-block w-100" alt="Mi querido monstruo">
            <div class="carousel-caption d-none d-md-block">
                <h5>Mi Querido Monstruo</h5>
                <p>Paramount Pictures</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/comunion.jfif" class="d-block w-100" alt="La niña de la comunión">
            <div class="carousel-caption d-none d-md-block">
                <h5>La niña de la comunión</h5>
                <p>Ikiru Films</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/fabelman.jpg" class="d-block w-100" alt="Los Fabelman">
            <div class="carousel-caption d-none d-md-block">
                <h5>Los Fabelman</h5>
                <p>Universal Pictures</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/oro-puro.jpeg" class="d-block w-100" alt="oro puro">
            <div class="carousel-caption d-none d-md-block">
                <h5>Oro Puro</h5>
                <p>Warner Broos</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/spiderman.jpeg" class="d-block w-100" alt="Spiderman">
            <div class="carousel-caption d-none d-md-block">
                <h5>Spiderman</h5>
                <p>Universal Pictures</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/superman.jpg" class="d-block w-100" alt="Superman">
            <div class="carousel-caption d-none d-md-block">
                <h5>Superman</h5>
                <p>Universal Pictures</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/titanic.jfif" class="d-block w-100" alt="Titanic">
            <div class="carousel-caption d-none d-md-block">
                <h5>Titanic</h5>
                <p>Paramount Pictures</p>
            </div>
        </div>
        <div class="carousel-item">
            <img src="/img/films/x-men.jpg" class="d-block w-100" alt="x men">
            <div class="carousel-caption d-none d-md-block">
                <h5>X Men</h5>
                <p>Marbel</p>
            </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
    </div>

<!------------------------          mostrar por genero ------------------------------------>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
