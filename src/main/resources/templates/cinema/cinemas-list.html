<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cines</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/cinemas.css">
    <script defer src="/js/app.js"></script>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="box">
    <div class="row mt-5">
        <h1 class="title-table">Cines</h1>
    </div>
</div>



<div class="col mt-3 alert alert-info" role="alert" th:if="${#lists.isEmpty(cinemas)}">
    Actualmente no hay ningún cine para mostrar.
</div>
<div class="create-opt">
    <a class="btn-club" th:href="@{/cinemas/create}" th:title="|Crear nuevo cine|"
       sec:authorize="isAuthenticated()" role="button">Crear nuevo cine</a>
</div>

<div class="horizontal-padding vertical-padding">

    <main class="container">
        <div class="row row-cols-1 row-cols-md-1 g-4">
            <div class="col" th:each="cinema : ${cinemas}">
                <div class="card">
                    <img th:src="@{${cinema.image}}" class="detail-img" th:alt="${cinema.name}"/>
                    <div class="card-img-overlay">
                        <h1 class="cinema-name" th:text="${cinema.name}"></h1>
                        <p class="card-text"></p>
                        <h5 class="card-title">Teléfono</h5>
                        <p class="card-text" th:text="${cinema.phone}"></p>
                        <h5 class="card-title">Sitio web</h5>
                        <p class="card-text" th:href="@{${cinema.url}}"></p>
                    </div>
                </div>
                <nav>
                    <ul class="actions-list">
                        <li>
                            <a th:title="|Ver detalle de ${cinema.name}|" th:href="@{/cinema/{id}(id=${cinema.id})}" role="button">
                                <img th:class="actions-list-btn" src="/img/icons/Ver.svg" th:alt="|Ver detalle de ${cinema.name}|">
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/cinemas/{id}/edit(id=${cinema.id})}" th:title="|Editar ${cinema.name}|"
                               sec:authorize="isAuthenticated()" role="button">
                                <img th:class="actions-list-btn" src="/img/icons/Editar.svg" th:alt="|Editar ${cinema.name}|">
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/cinemas/{id}/delete(id=${cinema.id})}" th:title="|Eliminar ${cinema.name}|"
                               sec:authorize="isAuthenticated()" role="button">
                                <img th:class="actions-list-btn" src="/img/icons/Borrar.svg" th:alt="|Eliminar detalle de ${cinema.name}|">
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <div class="text-center">
        Actualmente hay <span th:text="${#lists.size(cinemas)}"></span> cines.
    </div>
    <div class="text-center mt-4">
        <a class="btn-club" th:href="@{/}" th:title="|Volver a página principal|" role="button">Inicio</a>
    </div>
</div>
