<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title class ="h1-title">Cines</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-left">
    <div class="row mt-5">

        <h1 class="cinefilos-h1">Listado de cines</h1>

        <div>
            <a class="btn btn-outline-primary" th:href="@{/cinemas/create}">Crear nuevo cine</a>
        </div>

        <div class="col mt-4">
            <table class="table th">
                <thead>
                <tr>
                    <th scope="col">CIF</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Sitio web</th>
                    <th scope="col">Teléfono</th>
                    <th scope="col">Dirección</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cinema : ${cinemas}">
                    <td th:text="${cinema.cif}"></td>
                    <td th:text="${cinema.name}"></td>
                    <td th:text="${cinema.url}"></td>
                    <td th:text="${cinema.phone}"></td>
                    <td>
                        <a class="btn btn-light" th:text="${cinema.address.city}" th:href="@{/cinema/{id}(id=${cinema.address.id})}"></a>
                    </td>
                    <td>
                        <a class="btn btn-outline-primary" th:href="@{/cinema/{id}(id=${cinema.id})}">Ver</a>
                        <a class="btn btn-outline-success" th:href="@{/cinemas/{id}/edit(id=${cinema.id})}">Editar</a>
                        <a class="btn btn-outline-danger" th:href="@{/cinemas/{id}/delete(id=${cinema.id})}">Borrar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <a class="btn btn-outline-success" th:href="@{/}">Volver</a>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
