<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cinema detail</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
    <div class="row">
        <h1>En este cine</h1>
        <div class="col"></div>

        <div class="col">
            <div class="card">
                <img src="https://dummyimage.com/300" class="card-img-top" alt="Cinema Image">
                <div class="card-body">
                    <h5 class="card-title" th:text="${cine.name}"></h5>
                </div>
                <ul class="list-group list-group-flush">
                </ul>
                <div class="card-body">
                    <a class="btn btn-dark" th:href="@{/cines}">Volver</a>
                    <a class="btn btn-success" th:href="@{/cines/{id}/edit(id=${cine.id})}">Editar</a>
                    <a class="btn btn-danger" th:href="@{/cines/{id}/delete(id=${cine.id})}">Borrar</a>
                </div>
            </div>
        </div>

        <div class="col"></div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
