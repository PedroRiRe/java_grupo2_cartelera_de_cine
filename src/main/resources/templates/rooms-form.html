<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
        <title>Room Form</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: nav1}"></div>

<div class="container text-center">
    <div class="row">

        <div class="container text-center">
            <div class="row">

                <h1>Crear/Editar Room</h1>
                <h1 th:if="${room.id}">Modificar Room <span th:text="${room.id}"></span></h1>
                <h1 th:if="${room.id} == null">Crear nuevo Room</h1>

                <div class="col"></div>

                <div class="col">

            <div th:if="${error}">
                <div class="alert alert-danger" role="alert" >
                    <p th:text="${error}"></p>
                </div>
                <a type="button" class="btn btn-primary" th:href="@{/rooms}">Volver</a>
            </div>

            <form th:if="${error} == null" th:action="@{/rooms}" method="POST" th:object="${room}">

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" >
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" class="form-control" id="category" th:field="*{category}">
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>

        </div>

        <div class="col"></div>
    </div>
</div>

<div th:replace="~{footer :: footer1}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    </div>
</div>
</body>
</html>
