<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>---Cambiar---</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-left">
    <div class="row">
        <h1>Listado de salas</h1>

        <div class="col mt-3">
            <button type="button" class="btn btn-success">Crear nueva sala</button>

            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Número</th>
                    <th scope="col">Aforo</th>
                    <th scope="col">Estreno</th>
                    <th scope="col">Película</th>
                    <th scope="col">Cine</th>
                    <th scope="col">Botones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rooms: ${rooms}">
                    <td th:text="${rooms.id}"></td>
                    <td th:text="${rooms.roomNumber}"></td>
                    <td th:text="${rooms.capacity}"></td>
                    <td th:text="${rooms.premiere}"></td>
                    <td th:text="${rooms.film}"></td>
                    <td th:text="${rooms.cinema}"></td>
                    <td>
                        <a class="btn btn-primary btn-sm" th:href="@{/room/{id}(id=${rooms.id})}">Ver</a>
                        <button type="button" class="btn btn-success btn-sm">Editar</button>
                        <button type="button" class="btn btn-danger btn-sm">Borrar</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
