<!doctype html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="navbar" class="navbar sticky-top navbar-light shadow d-flex justify-content-between" style="background-color:#FFFFE0">
<header class="topheader">

    <nav th:fragment="navbar" class="topnav">

        <a class="logo" th:href="@{/}">
            <img src="/img/logo.svg" width="120" height="48" class="ms-4 d-inline-block align-top" alt="Logo Cinéfilos">
        </a>

    <ul class="nav navbar-nav flex-row ms-4">
        <li class="nav-item me-4">
            <a class="nav-link fs-5 text-primary" th:href="@{/addresses}">Direcciones</a>
        </li>
        <li class="nav-item me-4">
            <a class="nav-link fs-5 text-primary" th:href="@{/films}">Películas</a>
        </li>
        <li class="nav-item me-4">
            <a class="nav-link fs-5 text-primary" th:href="@{/cinemas}">Cines</a>
        </li>
        <li class="nav-item me-4">
            <a class="nav-link fs-5 text-primary" th:href="@{/rooms}">Salas</a>
        </li>
        <li class="nav-item me-4">
            <a class="nav-link fs-5 text-primary" th:href="@{/users}">Usuarios</a>
        </li>
    </ul>

    <div class="navbar-text d-flex flex-row me-3">
        <div sec:authorize="isAnonymous()">
            <a class="btn btn-link" th:href="@{/login}">Iniciar sesión</a>
        </div>
        <div sec:authorize="isAnonymous()">
            <a class="btn btn-link" th:href="@{/users/create}">Registro</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a class="btn btn-link" th:href="@{/user/{id}(id=${#authentication.getPrincipal().getId()})}">
                <span sec:authentication="principal.name"></span>&nbsp;
                <span sec:authentication="principal.surname"></span>
            </a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a class="btn btn-link" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>

</nav>
