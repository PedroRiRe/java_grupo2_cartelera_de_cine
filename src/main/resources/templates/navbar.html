<!doctype html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="">

<nav th:fragment="navbar" class="navbar sticky-top navbar-light" style="background-color:#FFFFE0">

    <a class="navbar-brand px-5" th:href="@{/}">
        <img src="/img/logo.svg" width="120" height="48" class="ms-4 d-inline-block align-top" alt="Logo Cinéfilos">
    </a>

    <ul class="nav navbar-nav flex-row ms-3">
        <li class="nav-item me-3">
            <a class="nav-link" th:href="@{/addresses}">Direcciones</a>
        </li>
        <li class="nav-item me-3">
            <a class="nav-link" th:href="@{/films}">Películas</a>
        </li>
        <li class="nav-item me-3">
            <a class="nav-link" th:href="@{/cinemas}">Cines</a>
        </li>
        <li class="nav-item me-3">
            <a class="nav-link" th:href="@{/rooms}">Salas</a>
        </li>
        <li class="nav-item me-3">
            <a class="nav-link" th:href="@{/users}">Usuarios</a>
        </li>
    </ul>

    <div class="navbar-text d-flex flex-row me-3">
        <div sec:authorize="isAnonymous()">
            <a class="btn btn-link" th:href="@{/login}">Iniciar sesión</a>
        </div>
        <div sec:authorize="isAnonymous()">
            <a class="btn btn-link" th:href="@{/users/create}">Registro</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a class="btn btn-link" th:href="@{/user/{id}(id=${#authentication.getPrincipal().getId()})}">
                <span sec:authentication="principal.name"></span>&nbsp;
                <span sec:authentication="principal.surname"></span>
            </a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a class="btn btn-link" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>

</nav>
