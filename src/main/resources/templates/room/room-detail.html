<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title cinefilos-title>Detalle de la sala</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
    <div class="row mt-5">
        <h1 class="cinefilos-h1">Detalle de la sala</h1>
        <div class="col">
        </div>
        <div class="col">
            <div class="card">
                <img src="https://dummyimage.com/300" class="card-img-top" alt="Sala Image">
                <div class="card-body">
                    <h5 class="card-title" th:text="|Sala ID: ${room.id}|"></h5>
                    <p class="card-text" th:text="${room.premiere}"></p>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:text="|Aforo: ${room.capacity}|"></li>
                    <li class="list-group-item" th:text="|Película: ${room.film}|"></li>
                    <li class="list-group-item" th:text="|Cine: ${room.cinema}|"></li>
                </ul>
                <div class="card-body">
                    <a class="btn btn-outline-primary" th:href="@{/rooms}">Volver</a>
                </div>
            </div>
        </div>
        <div class="col">
        </div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
