<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Salas</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/table.css">
    <script defer src="js/app.js"></script>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="box">
    <div class="row mt-5">
        <h1 class="title-table">Listado de salas</h1>
    </div>
</div>

<div class="col mt-3 alert alert-info" role="alert" th:if="${#lists.isEmpty(rooms)}">
    Actualmente no hay ninguna sala para mostrar.
</div>
<div class="col mt-3" th:if="${#lists.size(rooms) > 0}">
    <main class="container">
        <table class="list">
            <thead class="paragraphs">
            <tr>
                <th scope="col">Nº sala</th>
                <th scope="col">Cine</th>
                <th scope="col">Película</th>
                <th scope="col">Estreno</th>
                <th scope="col">Opciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rooms: ${rooms}">
                <td th:text="${rooms.roomNumber}"></td>
                <td>
                    <button class="btn-club" type="button" th:text="${rooms.cinema.name}"
                            th:href="@{/rooms/cinema/{id}(id=${rooms.cinema.id})}"></button>
                <td>
                    <button class="btn-club" type="button" th:text="${rooms.film.title}"
                            th:href="@{/rooms/film/{id}(id=${rooms.film.id})}"></button>
                </td>
                <td th:text="${rooms.premiere}"></td>
                <td>
                    <button class="btn-detail" type="button"
                            th:href="@{/room/{id}(id=${rooms.id})}" role="button">Ver
                    </button>
                    <button class="btn-edit" type="button" th:href="@{/rooms/{id}/edit(id=${rooms.id})}"
                            sec:authorize="isAuthenticated()" role="button">Editar
                    </button>
                    <button class="btn-delete" type="button" th:href="@{/rooms/{id}/delete(id=${rooms.id})}"
                            sec:authorize="isAuthenticated()" role="button">Borrar
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
    <br>
    <div class="text-center">
        Actualmente hay <span th:text="${#lists.size(rooms)}"></span> salas.
    </div>
    <div class="text-center mt-4">
        <a class="btn btn-outline-primary" th:href="@{/rooms/create}"
           sec:authorize="isAuthenticated()" role="button">Crear nueva sala</a>
        <a class="btn btn-outline-success" th:href="@{/}" role="button">Volver</a>
    </div>
    <br>
    <br>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
