<!Doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title class="h1-title">Formulario Sala</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
    <div class="row">
        <h1 class="modificar" th:if="${room.id}">Modificar Sala<span class="modificar" th:text="${room.id}"></span></h1>
        <h1 class="modificar" th:if="${room.id} == null">Crear nueva Sala</h1>
        <div class="col"></div>
        <div class="col">
            <div th:if="${error}">
                <div class="alert alert-danger" role="alert">
                    <p th:text="${error}"></p>
                </div>
                <a type="button" class="btn btn-primary" th:href="@{/rooms}">Volver</a>
            </div>
            <form th:if="${error} == null" th:action="@{/rooms}" method="POST" th:object="${room}">
                <input type="hidden" id="id" name="id" th:field="*{id}"/>
                <div class="mb-4">
                    <label for="roomNumber" class="form-label">Número de Sala</label>
                    <input type="text" class="form-control" id="roomNumber" th:field="*{roomNumber}">
                </div>
                <div class="mb-3">
                    Seleccionar película
                    <select aria-label="Films" class="form-select" th:field="*{film}">
                        <option th:if="${room.id} == null" selected value="0"></option>
                        <option th:each="film : ${films}" th:value="${film.id}" th:text="${film.title}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="premiere" class="form-label">Día de estreno</label>
                    <input type="date" class="form-control" id="premiere" th:field="*{premiere}">
                </div>
                <div class="mb-4">
                    <label for="schedules" class="form-label">Sesión</label>
                    <input type="time" class="form-control" id="schedules" th:field="*{schedules}">
                </div>

                <!--
                <div class="mb-3">
                    Seleccione horarios para las sesiones
                    <select aria-label="schedules" class="form-select" th:field="*{schedules}" multiple>
                        <option th:each="room : ${schedules}" th:value="${schedules}" th:text="|16:00 |"></option>
                    </select>
                </div>
                -->
                <!--
                <div class="mb-4">
                    <select class="form-select" multiple aria-label="multiple select example">
                        <option selected>Selecione las horas de pase de la película</option>
                        <option value="1">16:00</option>
                        <option value="2">18:00</option>
                        <option value="3">20:00</option>
                    </select>
                </div>
                -->

                <div class="form-check mb-5 text-start">
                    <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                    <label class="form-check-label" for="active">Sala operativa</label>
                </div>
                <div class="mb-4">
                    <label for="capacity" class="form-label">Aforo</label>
                    <input type="text" class="form-control" id="capacity" th:field="*{capacity}">
                </div>
                <div class="mb-3">
                    <select aria-label="Cinemas" class="form-select" th:field="*{cinema}">
                        <option th:if="${room.id} == null" selected value="0">Seleccionar cine</option>
                        <option th:each="cinema : ${cinemas}" th:value="${cinema.id}" th:text="${cinema.name}"></option>
                    </select>
                </div>
                <a class="btn btn-outline-primary" th:href="@{/rooms}">Cancelar</a>
                <button type="submit" class="btn btn-outline-success">Guardar</button>
            </form>
        </div>
        <div class="col"></div>
    </div>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
