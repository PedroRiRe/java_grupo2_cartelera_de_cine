<!Doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Películas</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/table.css">
    <script defer src="/js/app.js"></script>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="box">
    <div class="row mt-5">
        <h1 class="title-table">Películas</h1>
    </div>
</div>
<div class="col mt-3 alert alert-info" role="alert" th:if="${#lists.isEmpty(films)}">
    Actualmente no hay ninguna película para mostrar.
</div>
<div class="create-opt">
    <a class="btn-club" th:href="@{/films/create}" th:title="|Crear una nueva película|"
       sec:authorize="isAuthenticated()" role="button">Crear nueva película</a>
</div>

<div class="horizontal-padding vertical-padding">

    <main class="container">
        <div class="row row-cols-1 row-cols-md-4 g-4">
            <div class="col" th:each="film: ${films}">
                <div class="card">
                    <img th:if="${film.poster} != null" th:src="@{${film.poster}}" class="img-top" th:alt="${film.title}"/>
                   <img th:unless="${film.poster} != null" th:src="@{/img/icons/logo.png}" class="card-img-top"/>
                    <div class="card-body">
                        <h5 class="card-title">Título</h5>
                        <p class="card-text-film" th:text="${film.title}"></p>
                            <h5 class="card-title">Duración</h5>
                            <p class="card-text" th:text="|${film.duration} min|"></p>
                        <h5 class="card-title">Una película de:</h5>
                        <p class="card-text-company" th:text="${film.company}"></p>
                        <h5 class="card-title">Apta para:</h5>
                        <p class="card-text" th:text="${film.classification}"></p>
                    </div>
                </div>
                <footer th:class="card-footer">
                    <nav>
                        <ul class="actions-list">
                            <li>
                                <a th:title="|Ver detalle de ${film.title}|" th:href="@{/film/{id}(id=${film.id})}" role="button">
                                    <img width="35px" height="35px" src="/img/icons/Ver.svg" th:alt="|Ver detalle de ${film.title}|">
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/films/{id}/edit(id=${film.id})}" th:title="|Editar ${film.title}|"
                                   sec:authorize="isAuthenticated()" role="button">
                                    <img width="35px" height="35px" src="/img/icons/Editar.svg" th:alt="|Edit detalle de ${film.title}|">
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/films/{id}/delete(id=${film.id})}" th:title="|Eliminar ${film.title}|"
                                   sec:authorize="isAuthenticated()" role="button">
                                    <img width="35px" height="35px" src="/img/icons/Borrar.svg" th:alt="|Eliminar detalle de ${film.title}|">
                                </a>
                            </li>
                        </ul>
                    </nav>
                </footer>
            </div>
        </div>
    </main>

    <div class="list-footer">
        Actualmente hay <span th:text="${#lists.size(films)}"></span> películas.
    </div>
    <div class="text-center mt-4">
        <a class="btn-club" th:href="@{/}" th:title="|Volver a página principal|" role="button">Inicio</a>
    </div>
</div>
