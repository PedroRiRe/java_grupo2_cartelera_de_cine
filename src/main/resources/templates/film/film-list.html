<!Doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title class ="h1-title">Películas</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-left">
    <div class="row mt-5">
        <h1 class="cinefilos-h1">Listado de películas</h1>

<!--        <form th:if="${not #lists.isEmpty(cities)}" th:action="@{/films/} + ${city}" method="GET">-->
<!--            <p>Elija una ciudad:</p>-->
<!--            <div class="mb-4">-->
<!--                <select name="city" aria-label="Ciudades" class="form-select" th:field="*{cities}">-->
<!--                    <option th:each="city : ${cities}" th:value="${city}" th:text="${city}"></option>-->
<!--                </select>-->
<!--            </div>-->
<!--            <button type="submit" class="btn btn-outline-info">Listar</button>-->
<!--        </form>-->

        <div>
            <a class="btn btn-outline-primary" th:href="@{/films/create}" sec:authorize="isAuthenticated()">Crear nueva película</a>
        </div>
        <div class="col mt-4">
            <table class="table th">
                <thead>
                <tr>
                    <th scope="col">Título</th>
                    <th scope="col">Duración</th>
                    <th scope="col">Año</th>
                    <th scope="col">País</th>
                    <th scope="col">Clasific.</th>
                    <th scope="col">Compañía</th>
                    <th scope="col">Opciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="film: ${films}">
                    <td th:text="${film.title}"></td>
                    <td th:text="${film.duration}"></td>
                    <td th:text="${film.year}"></td>
                    <td th:text="${film.country}"></td>
                    <td th:text="${film.classification}"></td>
                    <td th:text="${film.company}"></td>
                    <td>
                        <a class="btn btn-outline-primary" th:href="@{/film/{id}(id=${film.id})}">Ver</a>
                        <a class="btn btn-outline-success" th:href="@{/films/{id}/edit(id=${film.id})}" sec:authorize="isAuthenticated()">Editar</a>
                        <a class="btn btn-outline-danger" th:href="@{/films/{id}/delete(id=${film.id})}" sec:authorize="isAuthenticated()">Borrar</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="alert alert-info" role="alert" th:if="${#lists.isEmpty(films)}">
                Actualmente no hay ninguna película para mostrar.
            </div>
            <div class="text-center" th:if="${#lists.size(films) > 0}">
                Actualmente hay <span th:text="${#lists.size(films)}"></span> películas.
            </div>
        </div>
    </div>
    <a class="btn btn-outline-success" th:href="@{/}">VOLVER</a>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
