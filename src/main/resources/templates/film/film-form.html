<!Doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title cinefilos-title>Formulario Film</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/appcinefilos.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-center">
  <div class="row">

    <h1 th:if="${film.id}" class="h1-title">Modificar Film <span th:text="${film.id}"></span></h1>
    <h1 th:if="${film.id} == null" class="h1-title">Crear nuevo Film</h1>


    <div class="col"></div>

    <div class="col">

      <div th:if="${error}">
        <div class="alert alert-danger" role="alert" >
          <p th:text="${error}"></p>
        </div>
        <a type="button" class="btn btn-primary" th:href="@{/films}">Volver</a>
      </div>

      <form th:if="${error} == null" th:action="@{/films}" method="POST" th:object="${film}">

        <input type="hidden" id="id" name="id" th:field="*{id}" />

        <div class="mb-4">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" th:field="*{title}" >
        </div>

        <div class="mb-4">
          <label for="duration" class="form-label">Duration</label>
          <input type="text" class="form-control" id="duration" th:field="*{duration}">
        </div>

        <div class="mb-4">
          <label for="year" class="form-label">Year</label>
          <input type="text" class="form-control" id="year" th:field="*{year}">
        </div>

        <div class="mb-4">
          <label for="director" class="form-label">Director</label>
          <input type="text" class="form-control" id="director" th:field="*{director}">
        </div>

        <div class="mb-4">
          <label for="country" class="form-label">Country</label>
          <input type="text" class="form-control" id="country" th:field="*{country}">
        </div>

        <div class="mb-4">
          <label for="classification" class="form-label">Classification</label>
          <input type="text" class="form-control" id="classification" th:field="*{classification}">
        </div>

        <div class="mb-4">
          <label for="music" class="form-label">Music</label>
          <input type="text" class="form-control" id="music" th:field="*{music}">
        </div>

        <div class="mb-4">
          <label for="photography" class="form-label">Photography</label>
          <input type="text" class="form-control" id="photography" th:field="*{photography}">
        </div>

        <div class="mb-4">
          <label for="script" class="form-label">Script</label>
          <input type="text" class="form-control" id="script" th:field="*{script}">
        </div>

        <div class="mb-4">
          <label for="company" class="form-label">Company</label>
          <input type="text" class="form-control" id="company" th:field="*{company}">
        </div>



        <a class="btn btn-danger" th:href="@{/films}">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </form>

    </div>

    <div class="col"></div>
  </div>
</div>


<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
