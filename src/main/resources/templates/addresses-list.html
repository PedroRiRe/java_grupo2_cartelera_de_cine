<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Address List</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container text-left">
    <div class="row">
        <h1>Listado de direcciones</h1>

        <div class="col mt-3">
            <button type="button" class="btn btn-success">Crear nueva dirección</button>

            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Dirección</th>
                    <th scope="col">CP</th>
                    <th scope="col">Ciudad</th>
                    <th scope="col">País</th>
                    <th scope="col">Opciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="address: ${addresses}">
                    <td th:text="${address.id}"></td>
                    <td th:text="${address.address}"></td>
                    <td th:text="${address.postalCode}"></td>
                    <td th:text="${address.city}"></td>
                    <td th:text="${address.country}"></td>
                    <td>
                        <a class="btn btn-primary btn-sm" th:href="@{/address/{id}(id=${address.id})}">Ver</a>
                        <button type="button" class="btn btn-success btn-sm">Editar</button>
                        <button type="button" class="btn btn-danger btn-sm">Borrar</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
